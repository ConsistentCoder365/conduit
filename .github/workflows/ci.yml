name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit, stress, fault-injection and Testcontainers tests
        run: ./gradlew test

      - name: Benchmark smoke gate
        run: ./gradlew benchSmoke -PbenchArgs="smoke --baseline bench/baseline-ci.json"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/tests/test
            bench/results/smoke.json
