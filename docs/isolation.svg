<text class="ax" x="62" y="272.5" text-anchor="end">100k</text>
<line class="grid" x1="70.0" y1="207.0" x2="610.0" y2="207.0"/>
<text class="ax" x="62" y="211.0" text-anchor="end">200k</text>
<line class="grid" x1="70.0" y1="145.5" x2="610.0" y2="145.5"/>
<text class="ax" x="62" y="149.5" text-anchor="end">300k</text>
<line class="grid" x1="70.0" y1="84.0" x2="610.0" y2="84.0"/>
<text class="ax" x="62" y="88.0" text-anchor="end">400k</text>
<text class="ax" x="70.0" y="348" text-anchor="middle">0s</text>
<text class="ax" x="137.1" y="348" text-anchor="middle">2s</text>
<text class="ax" x="204.2" y="348" text-anchor="middle">4s</text>
<text class="ax" x="271.2" y="348" text-anchor="middle">6s</text>
<text class="ax" x="338.3" y="348" text-anchor="middle">8s</text>
<text class="ax" x="405.4" y="348" text-anchor="middle">10s</text>
<text class="ax" x="472.5" y="348" text-anchor="middle">12s</text>
<text class="ax" x="539.6" y="348" text-anchor="middle">14s</text>
<text class="ax" x="606.6" y="348" text-anchor="middle">16s</text>
<text class="ax" transform="translate(14,207) rotate(-90)" text-anchor="middle">acknowledged events / second</text>
<line x1="70" y1="66" x2="88" y2="66" stroke="var(--s1)" stroke-width="2"/><text class="ax" x="94" y="70">healthy file sink</text>
