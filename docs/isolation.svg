<svg xmlns="http://www.w3.org/2000/svg" class="viz" viewBox="0 0 720 380" width="720" height="380" role="img">
<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e6e5e0;
         --s1:#2a78d6; --s2:#eb6834; --band:#f0efea; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#2e2e2c;
           --s1:#3987e5; --s2:#d95926; --band:#252523; }
  }
  .viz text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .t { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .st { fill: var(--ink2); font-size: 12px; }
  .ax { fill: var(--ink2); font-size: 11px; }
  .mu { fill: var(--muted); font-size: 11px; }
  .lb { fill: var(--ink); font-size: 11px; font-weight: 600; }
  .grid { stroke: var(--grid); stroke-width: 1; }
</style>
<rect width="720" height="380" rx="8" fill="var(--surface)"/>
<text class="t" x="20" y="28">Healthy sink throughput while another sink hangs</text>
<text class="st" x="20" y="48">Both sinks get every event at 200,000/s. Fault sink hangs 5–11 s; healthy averaged 95% of normal.</text>
<rect x="237.7" y="84" width="201.2" height="246.0" fill="var(--band)"/>
<text class="mu" x="338.3" y="98" text-anchor="middle">outage</text>
