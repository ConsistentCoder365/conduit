<svg xmlns="http://www.w3.org/2000/svg" class="viz" viewBox="0 0 720 400" width="720" height="400" role="img">
<style>
  .viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e6e5e0;
         --s1:#2a78d6; --s2:#eb6834; --band:#f0efea; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#2e2e2c;
           --s1:#3987e5; --s2:#d95926; --band:#252523; }
  }
  .viz text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  .t { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .st { fill: var(--ink2); font-size: 12px; }
  .ax { fill: var(--ink2); font-size: 11px; }
  .mu { fill: var(--muted); font-size: 11px; }
  .lb { fill: var(--ink); font-size: 11px; font-weight: 600; }
  .grid { stroke: var(--grid); stroke-width: 1; }
</style>
<rect width="720" height="400" rx="8" fill="var(--surface)"/>
<text class="t" x="20" y="28">Throughput vs processing workers</text>
<text class="st" x="20" y="48">Median of 3 runs, 3,000,000 events each, synthetic → filter → 3 transforms → file sink. Whiskers: min–max.</text>
<line class="grid" x1="70.0" y1="322.0" x2="690.0" y2="322.0"/>
<text class="ax" x="62" y="326.0" text-anchor="end">0</text>
<line class="grid" x1="70.0" y1="259.0" x2="690.0" y2="259.0"/>
<text class="ax" x="62" y="263.0" text-anchor="end">500k</text>
<line class="grid" x1="70.0" y1="196.0" x2="690.0" y2="196.0"/>
<text class="ax" x="62" y="200.0" text-anchor="end">1M</text>
<line class="grid" x1="70.0" y1="133.0" x2="690.0" y2="133.0"/>
<text class="ax" x="62" y="137.0" text-anchor="end">1.50M</text>
<line class="grid" x1="70.0" y1="70.0" x2="690.0" y2="70.0"/>
<text class="ax" x="62" y="74.0" text-anchor="end">2M</text>
<text class="ax" transform="translate(14,196) rotate(-90)" text-anchor="middle">events / second</text>
<path d="M70.0,241.5L225.0,160.9" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>
<text class="mu" x="233.0" y="164.9">linear scaling</text>
<line x1="70.0" y1="244.2" x2="70.0" y2="239.7" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
<text class="ax" x="70.0" y="342" text-anchor="middle">1</text>
<text class="mu" x="70.0" y="358" text-anchor="middle">3.5 cores</text>
<line x1="225.0" y1="222.7" x2="225.0" y2="210.1" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
<text class="ax" x="225.0" y="342" text-anchor="middle">2</text>
<text class="mu" x="225.0" y="358" text-anchor="middle">5.5 cores</text>
<line x1="380.0" y1="244.2" x2="380.0" y2="209.7" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
<text class="ax" x="380.0" y="342" text-anchor="middle">4</text>
<text class="mu" x="380.0" y="358" text-anchor="middle">5.6 cores</text>
<line x1="535.0" y1="210.4" x2="535.0" y2="202.3" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
<text class="ax" x="535.0" y="342" text-anchor="middle">8</text>
<text class="mu" x="535.0" y="358" text-anchor="middle">6.4 cores</text>
<line x1="690.0" y1="280.4" x2="690.0" y2="262.7" stroke="var(--s1)" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
<text class="ax" x="690.0" y="342" text-anchor="middle">16</text>
<text class="mu" x="690.0" y="358" text-anchor="middle">5.9 cores</text>
<text class="ax" x="380.0" y="388" text-anchor="middle">processing workers (CPU cores busy below)</text>
<path d="M70.0,241.5L225.0,212.2L380.0,217.6L535.0,206.5L690.0,266.2" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>
<circle cx="70.0" cy="241.5" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>1 workers: 639,095 events/s</title></circle>
<text class="lb" x="78.0" y="261.5" text-anchor="start">639k</text>
<circle cx="225.0" cy="212.2" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>2 workers: 871,662 events/s</title></circle>
<circle cx="380.0" cy="217.6" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>4 workers: 828,734 events/s</title></circle>
<circle cx="535.0" cy="206.5" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>8 workers: 917,032 events/s</title></circle>
<text class="lb" x="535.0" y="194.5" text-anchor="middle">917k  (1.43×)</text>
<circle cx="690.0" cy="266.2" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>16 workers: 442,872 events/s</title></circle>
</svg>
